<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบผู้ดูแล - Greek NOOM NOOM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5c3d2e;
            --primary-light: #8b5a42;
            --accent: #e0a96d;
            --bg-base: #faf6f0;
            --bg-card: #ffffff;
            --text-dark: #2c221e;
            --danger: #d32f2f;
            --radius-md: 12px;
            --shadow: 0 10px 25px rgba(92, 61, 46, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background-color: var(--bg-base); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .login-card {
            background: var(--bg-card);
            max-width: 400px;
            width: 100%;
            padding: 40px 30px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            text-align: center;
        }
        .login-card h2 { color: var(--primary); font-size: 1.6rem; margin-bottom: 8px; }
        .login-card p { color: #888; font-size: 0.9rem; margin-bottom: 24px; }
        
        .form-group { text-align: left; margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; color: var(--text-dark); }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #ddd;
            border-radius: var(--radius-md);
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--primary); }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover { background: var(--primary-light); }
        .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 12px; display: none; }
        .back-link { display: inline-block; margin-top: 18px; font-size: 0.9rem; color: var(--primary-light); text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .hint-box { background: #fdf6ec; border: 1px solid #faecd8; padding: 10px; border-radius: 8px; margin-bottom: 18px; font-size: 0.82rem; color: #b88230; text-align: left; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🥣 ผู้ดูแลระบบ</h2>
        <p>Greek NOOM NOOM Back-office</p>

        <div class="hint-box">
            🔑 <strong>ข้อมูลทดสอบเข้าสู่ระบบ:</strong><br>
            Username: <code>admin</code><br>
            Password: <code>password123</code>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="username" class="form-control" placeholder="กรอก Username" required value="admin">
            </div>
            <div class="form-group">
                <label>รหัสผ่าน (Password)</label>
                <input type="password" id="password" class="form-control" placeholder="กรอก Password" required value="password123">
            </div>

            <div id="error-alert" class="error-msg">ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง</div>

            <button type="submit" class="btn-login">เข้าสู่ระบบ</button>
        </form>

        <a href="greekyo.html" class="back-link">← กลับไปยังหน้าร้านหลัก (greekyo.html)</a>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            // กำหนด User / Pass ของ Admin
            if (u === "raweechon529@gmail.com" && p === "Raweechon1152538") {
                sessionStorage.setItem("isAdminLoggedIn", "true");
                window.location.href = "admin.html";
            } else {
                document.getElementById('error-alert').style.display = "block";
            }
        }
    </script>
</body>
</html>
